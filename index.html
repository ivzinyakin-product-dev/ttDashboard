    const state = {
      category: 'TEAM', // TEAM | SINGLES | DOUBLES | MIXED
      gender: 'M'       // M | W
    };

    function getActiveEventCode() {
      if (state.category === 'MIXED') return 'XD';
      if (state.category === 'TEAM') return state.gender === 'M' ? 'MT' : 'WT';
      if (state.category === 'SINGLES') return state.gender === 'M' ? 'MS' : 'WS';
      if (state.category === 'DOUBLES') return state.gender === 'M' ? 'MD' : 'WD';
      return 'MT';
    }

    function updateControlsUI() {
      document.querySelectorAll('.cat-btn').forEach(btn => {
        const c = btn.getAttribute('data-cat');
        if (c === state.category) {
          btn.className = 'cat-btn px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition bg-teal-500 text-slate-950 shadow';
        } else {
          btn.className = 'cat-btn px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition text-slate-300 hover:text-white';
        }
      });

      const genderContainer = document.getElementById('genderTabs');
      if (state.category === 'MIXED') {
        genderContainer.classList.add('opacity-40', 'pointer-events-none');
      } else {
        genderContainer.classList.remove('opacity-40', 'pointer-events-none');
      }

      document.querySelectorAll('.gender-btn').forEach(btn => {
        const g = btn.getAttribute('data-gender');
        if (g === state.gender) {
          btn.className = 'gender-btn px-4 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition bg-blue-500 text-white shadow';
        } else {
          btn.className = 'gender-btn px-4 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition text-slate-300 hover:text-white';
        }
      });
    }

    function renderBracketNode(match) {
      return `
        <div class="panel rounded-xl p-3 space-y-2">
          <div class="flex items-center justify-between text-[11px] text-slate-400">
            <span>${match.label}</span>
          </div>
          <div class="space-y-1.5">
            <div class="flex items-center justify-between gap-2 bg-slate-900/90 px-2.5 py-1.5 rounded-lg border border-slate-800">
              <span class="text-xs sm:text-sm font-semibold text-white">${match.a}</span>
              <span class="text-xs font-bold px-2 py-0.5 rounded bg-slate-800 text-teal-300 shrink-0">${match.scoreA}</span>
            </div>
            <div class="flex items-center justify-between gap-2 bg-slate-900/90 px-2.5 py-1.5 rounded-lg border border-slate-800">
              <span class="text-xs sm:text-sm font-semibold text-white">${match.b}</span>
              <span class="text-xs font-bold px-2 py-0.5 rounded bg-slate-800 text-teal-300 shrink-0">${match.scoreB}</span>
            </div>
          </div>
        </div>
      `;
    }

    function renderView() {
      const code = getActiveEventCode();
      const bracketData = BRACKETS[code];
      const eventMatches = MATCHES.filter(m => m.ev === code);

      document.getElementById('activeDivisionTitle').textContent = bracketData.title;
      document.getElementById('activeDivisionCount').textContent = `Матчей в списке: ${eventMatches.length}`;

      // Render Bracket Columns (1/4 -> 1/2 -> Final)
      const bracketContainer = document.getElementById('bracketContainer');
      bracketContainer.innerHTML = `
        <div class="space-y-2.5">
          <div class="text-xs font-semibold text-teal-300 px-1">1/4 финала</div>
          <div class="space-y-2.5">
            ${bracketData.qf.map(renderBracketNode).join('')}
          </div>
        </div>
        <div class="space-y-2.5 flex flex-col justify-center">
          <div class="text-xs font-semibold text-blue-300 px-1">1/2 финала</div>
          <div class="space-y-4">
            ${bracketData.sf.map(renderBracketNode).join('')}
          </div>
        </div>
        <div class="space-y-2.5 flex flex-col justify-center">
          <div class="text-xs font-semibold text-amber-300 px-1">Финал</div>
          <div>
            ${bracketData.final.map(renderBracketNode).join('')}
          </div>
        </div>
      `;

      // Group matches by stage
      const stagesMap = new Map();
      eventMatches.forEach(m => {
        if (!stagesMap.has(m.stage)) stagesMap.set(m.stage, []);
        stagesMap.get(m.stage).push(m);
      });

      const matchesContainer = document.getElementById('matchesByStageContainer');
      matchesContainer.innerHTML = '';

      stagesMap.forEach((list, stageName) => {
        const block = document.createElement('div');
        block.className = 'panel rounded-xl overflow-hidden';

        const rowsHtml = list.map(m => {
          const scoreBadgeClass = m.done
            ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40'
            : 'bg-slate-800 text-slate-300 border-slate-700';

          return `
            <div class="px-3.5 py-2.5 flex flex-col md:flex-row md:items-center justify-between gap-2 hover:bg-slate-800/40 transition">
              <div class="flex items-center gap-2 text-xs text-slate-400 md:w-44 shrink-0">
                <span class="font-medium text-slate-300">${m.time}</span>
                <span>•</span>
                <span>${m.table}</span>
              </div>
              <div class="flex-1 flex flex-col sm:flex-row sm:items-center justify-between gap-2 bg-slate-900/60 px-3 py-2 rounded-lg border border-slate-800/80">
                <div class="flex-1 text-xs sm:text-sm font-semibold text-white sm:text-right break-words">${m.a}</div>
                <div class="flex justify-center shrink-0 my-1 sm:my-0 sm:mx-3">
                  <span class="px-2.5 py-0.5 rounded text-xs font-bold border ${scoreBadgeClass} whitespace-nowrap">${m.score}</span>
                </div>
                <div class="flex-1 text-xs sm:text-sm font-semibold text-white break-words">${m.b}</div>
              </div>
            </div>
          `;
        }).join('');

        block.innerHTML = `
          <div class="px-3.5 py-2.5 bg-slate-900/95 border-b border-slate-800 flex items-center justify-between">
            <span class="text-xs sm:text-sm font-bold text-teal-300">${stageName}</span>
            <span class="text-xs text-slate-400">Матчей: ${list.length}</span>
          </div>
          <div class="divide-y divide-slate-800/70">
            ${rowsHtml}
          </div>
        `;
        matchesContainer.appendChild(block);
      });
    }

    // Динамическая подгрузка свежих данных из ./data.json (для GitHub Pages)
    const DATA_JSON_URL = './data.json';
    const REFRESH_INTERVAL_MS = 60000;

    async function syncLiveScores() {
      const dotEl = document.getElementById('liveSyncDot');
      const textEl = document.getElementById('liveSyncText');
      try {
        const response = await fetch(DATA_JSON_URL + '?t=' + Date.now(), { cache: 'no-store' });
        if (!response.ok) return;
        const payload = await response.json();
        if (payload && payload.brackets && Array.isArray(payload.matches)) {
          Object.assign(BRACKETS, payload.brackets);
          MATCHES.length = 0;
          MATCHES.push(...payload.matches);
          renderView();
          if (dotEl) dotEl.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse';
          if (textEl) {
            const now = new Date();
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            textEl.textContent = 'Обновлено в ' + hh + ':' + mm;
          }
        }
      } catch (err) {
        // В локальном превью или до первого создания data.json используем встроенные данные
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateControlsUI();
      renderView();
      syncLiveScores();
      setInterval(syncLiveScores, REFRESH_INTERVAL_MS);

      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.category = btn.getAttribute('data-cat');
          updateControlsUI();
          renderView();
        });
      });

      document.querySelectorAll('.gender-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.gender = btn.getAttribute('data-gender');
          updateControlsUI();
          renderView();
        });
      });
    });
  </script>
